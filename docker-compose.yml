services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-rm_auth_tenant}_app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "${APP_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-rm_auth_tenant}_db
    environment:
      # Defaults deliberately match .env.example -- distinct from
      # rm_auth_project's own docker-compose.yml (appdb/rm_auth_db) so the
      # two projects never collide if both are ever run at once. See the
      # "Tier B Implementation Plan" doc's correction note for the incident
      # that made this distinction necessary.
      POSTGRES_DB: ${POSTGRES_DB:-rm_auth_tenant_appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-rm_auth_tenant_appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
