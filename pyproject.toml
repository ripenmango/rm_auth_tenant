[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rm-auth-tenant"
version = "0.1.0"
description = "Tenant-scoped identity & policy-driven authorization (Django installable app). Split out of rm-auth for schema-per-tenant isolation -- see the 'Tier B Implementation Plan' doc in rm_workflow_store/docs/, section 0/0.1."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27,<1.0",
    "psycopg2-binary>=2.9",
    "pyjwt>=2.8",
    "casbin>=1.34",
    "drf_base @ file:///Users/lsharma/personal/drf-base/dist/drf_base-0.1.0-py3-none-any.whl",
    "rm_auth @ file:///Users/lsharma/personal/rm_auth_project/dist/rm_auth-0.1.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "black>=24.0",
    "ruff>=0.4",
    "import-linter>=2.0",
]

# --- Packaging: only ship the library app, not the test harness project
# or this app's own test suite (rm_auth_tenant/tests/) ---
[tool.setuptools.packages.find]
include = ["rm_auth_tenant*"]
exclude = ["rm_auth_tenant.tests*"]

# setuptools' packages.find only collects .py files by default -- non-Python
# data (the Casbin model.conf that RM_AUTH["CASBIN_MODEL_PATH"] points at)
# needs an explicit package-data entry or it's silently left out of every
# built wheel, breaking any consumer as soon as the policy engine tries to
# load it.
[tool.setuptools.package-data]
rm_auth_tenant = ["policy/*.conf"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
log_cli = true
log_cli_level = "INFO"

# --- import-linter contracts: enforce "views never touch models" AND
# "this app depends on rm_auth, never the reverse" (see "Tier B
# Implementation Plan" doc, section 0.1) ---
[tool.importlinter]
root_package = "rm_auth_tenant"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "rm_auth_tenant.api",
    "rm_auth_tenant.services",
    "rm_auth_tenant.policy | rm_auth_tenant.roles | rm_auth_tenant.permissions | rm_auth_tenant.jwt_auth | rm_auth_tenant.accounts | rm_auth_tenant.audit",
]

[[tool.importlinter.contracts]]
name = "Never import rm_auth's internals directly -- only its public models/repositories/middleware"
type = "forbidden"
source_modules = ["rm_auth_tenant"]
forbidden_modules = ["rm_auth.migrations"]
